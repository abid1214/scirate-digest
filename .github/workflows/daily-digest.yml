name: Daily SciRate Digest

on:
  schedule:
    # 13:30 UTC daily — after SciRate's morning listing settles.
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      top:
        description: "Number of papers"
        default: "10"
      range:
        description: "SciRate ranking window (days)"
        default: "1"
      ids:
        description: "Space-separated arXiv IDs (skips the SciRate scrape)"
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

defaults:
  run:
    # Use bash on every runner, including a self-hosted Windows one (Git for
    # Windows ships Git Bash, which GitHub Actions' `bash` shell finds).
    shell: bash

jobs:
  digest:
    # Runs on your self-hosted runner. Its residential/office IP is what
    # gets SciRate past Cloudflare — GitHub's own datacenter runners cannot.
    # See README → "Self-hosted runner" for one-time setup.
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        timeout-minutes: 15
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser]"
          python -m playwright install chromium || echo "::warning::playwright chromium install failed"
          # Camoufox is the primary Cloudflare-passing browser; its download
          # can be large, so failure here just drops that one strategy.
          python -m camoufox fetch || echo "::warning::camoufox fetch failed; runtime will fall back"
          # A virtual display lets the browsers run headed (passes Cloudflare
          # best). Only relevant on a headless Linux box without one already.
          if [ "$(uname)" = "Linux" ] && [ -z "$DISPLAY" ] && ! command -v xvfb-run >/dev/null 2>&1; then
            (sudo apt-get update && sudo apt-get install -y xvfb) \
              || echo "::warning::could not install xvfb; browsers will run headless"
          fi

      - name: Build digest
        timeout-minutes: 40
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          IDS="${{ github.event.inputs.ids || '' }}"
          EXTRA=""
          if [ -n "$IDS" ]; then EXTRA="--ids $IDS"; fi

          # Prefer a headed browser under a virtual display where possible;
          # a real desktop session ($DISPLAY set) works too. Otherwise fall
          # back to headless, which usually still passes from a home IP.
          if command -v xvfb-run >/dev/null 2>&1 && [ -z "$DISPLAY" ]; then
            SCIRATE_DIGEST_HEADED=1 xvfb-run -a scirate-digest \
              --top "${{ github.event.inputs.top || '10' }}" \
              --range "${{ github.event.inputs.range || '1' }}" $EXTRA
          else
            [ -n "$DISPLAY" ] && export SCIRATE_DIGEST_HEADED=1
            scirate-digest \
              --top "${{ github.event.inputs.top || '10' }}" \
              --range "${{ github.event.inputs.range || '1' }}" $EXTRA
          fi

      - name: Commit digest to repository
        run: |
          DATE=$(date -u +%F)
          mkdir -p "digests/$DATE"
          cp "output/$DATE/digest.md" "output/$DATE/podcast_script.txt" \
             "output/$DATE/papers.json" "digests/$DATE/"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "digests/$DATE"
          git diff --cached --quiet || git commit -m "Digest for $DATE"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish podcast episode as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%F)
          gh release create "digest-$DATE" \
            --title "SciRate Digest — $DATE" \
            --notes-file "output/$DATE/digest.md" \
            "output/$DATE/digest.mp3#Podcast episode ($DATE)" \
            || gh release upload "digest-$DATE" "output/$DATE/digest.mp3" --clobber

      - name: Upload artifacts (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: output/
          if-no-files-found: ignore
