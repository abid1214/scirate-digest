name: Daily SciRate Digest

on:
  schedule:
    # 13:30 UTC daily — after SciRate's morning listing settles.
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      top:
        description: "Number of papers"
        default: "5"
      range:
        description: "SciRate ranking window (days)"
        default: "1"
      ids:
        description: "Space-separated arXiv IDs (skips the SciRate scrape)"
        default: ""
      force:
        description: "Re-render even if today's episode already exists"
        default: "false"

permissions:
  contents: write
  issues: write  # close answered listener questions

concurrency:
  group: daily-digest
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  digest:
    # GitHub-hosted runner. SciRate's Cloudflare blocks datacenter IPs, so the
    # scrape is routed through a scraping-API service (SCRAPERAPI_KEY or
    # SCRAPINGBEE_KEY secret) that fetches from residential proxies.
    runs-on: ubuntu-latest
    # Per-turn TTS makes many short Gemini requests; the pro model is slow,
    # so the audio phase alone can take ~40 minutes.
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # ffmpeg is needed to transcode Gemini TTS PCM to MP3 (preinstalled
          # on ubuntu-latest; installed only if a runner actually lacks it).
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg || true
          fi

      # GitHub's cron can fire hours late (observed ~4h). Without this guard a
      # late firing re-renders a date that already published, spending the
      # day's Gemini TTS quota and replacing good audio with fallback voices.
      - name: Skip if today's episode already exists
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%F)
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "force requested; re-rendering $DATE"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ -f "digests/$DATE/papers.json" ] \
               && gh release view "digest-$DATE" >/dev/null 2>&1; then
            echo "::notice::Episode for $DATE is already published; skipping. Dispatch with force=true to re-render."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build digest
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 75
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          # Voices default to edge-tts (deterministic: the hosts never drift).
          # Set the VOICE_ENGINE repo variable to "gemini" to opt back in.
          VOICE_ENGINE: ${{ vars.VOICE_ENGINE }}
          EDGE_DIALOGUE_VOICES: ${{ vars.EDGE_DIALOGUE_VOICES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          GEMINI_VOICES: ${{ vars.GEMINI_VOICES }}
          # For fetching listener questions (issues titled "Q: ...")
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          IDS="${{ github.event.inputs.ids || '' }}"
          EXTRA=""
          if [ -n "$IDS" ]; then EXTRA="--ids $IDS"; fi
          scirate-digest \
            --top "${{ github.event.inputs.top || '5' }}" \
            --range "${{ github.event.inputs.range || '1' }}" \
            $EXTRA

      - name: Commit digest and update podcast feed
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -e
          DATE=$(date -u +%F)
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "digests/$DATE"
          cp "output/$DATE/digest.md" "output/$DATE/podcast_script.txt" \
             "output/$DATE/papers.json" "digests/$DATE/"
          # Records which TTS path rendered the audio (gemini-per-turn vs a
          # fallback), so an episode can be audited without reading CI logs.
          cp "output/$DATE/audio_meta.json" "digests/$DATE/" 2>/dev/null || true
          # Push with retries. On each attempt, rebase our staged files onto
          # the latest branch tip and REGENERATE the derived feed from the
          # current manifest — so a concurrent push never causes a merge
          # conflict on generated files (docs/feed.xml, episodes.json).
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --mixed "origin/$BRANCH"   # move to tip; keep working tree
            git add "digests/$DATE"
            python -m scirate_digest.feed --add "$DATE" \
              --mp3 "output/$DATE/digest.mp3" --papers "output/$DATE/papers.json"
            git add digests/episodes.json docs
            git commit -m "Digest for $DATE" || true
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push rejected (attempt $attempt); retrying"; sleep 3
          done
          echo "::error::could not push digest after retries"; exit 1

      - name: Publish podcast episode as a release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%F)
          # Recreate the release so its notes AND audio always reflect this
          # run (re-running a date fully replaces the prior release).
          gh release delete "digest-$DATE" --yes --cleanup-tag || true
          gh release create "digest-$DATE" \
            --title "SciRate Digest — $DATE" \
            --notes-file "output/$DATE/digest.md" \
            --target "${GITHUB_REF_NAME}" \
            "output/$DATE/digest.mp3#Podcast episode ($DATE)"

      - name: Close answered listener questions
        if: steps.guard.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%F)
          # Only closes questions the episode actually answered; the rest
          # stay open and are picked up by a later mailbag.
          python -m scirate_digest.questions \
            --close-file "output/$DATE/questions.json" \
            --script "output/$DATE/podcast_script.txt" --date "$DATE" \
            || echo "::warning::could not close answered questions"

      - name: Upload artifacts (backup)
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: output/
          if-no-files-found: ignore
