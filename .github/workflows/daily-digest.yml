name: Daily SciRate Digest

on:
  schedule:
    # 13:30 UTC daily — after SciRate's morning listing settles.
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      top:
        description: "Number of papers"
        default: "5"
      range:
        description: "SciRate ranking window (days)"
        default: "1"
      ids:
        description: "Space-separated arXiv IDs (skips the SciRate scrape)"
        default: ""

permissions:
  contents: write
  issues: write  # close answered listener questions

concurrency:
  group: daily-digest
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  digest:
    # GitHub-hosted runner. SciRate's Cloudflare blocks datacenter IPs, so the
    # scrape is routed through a scraping-API service (SCRAPERAPI_KEY or
    # SCRAPINGBEE_KEY secret) that fetches from residential proxies.
    runs-on: ubuntu-latest
    # Per-turn TTS makes many short Gemini requests; the pro model is slow,
    # so the audio phase alone can take ~40 minutes.
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # ffmpeg is needed to transcode Gemini TTS PCM to MP3 (preinstalled
          # on ubuntu-latest; installed only if a runner actually lacks it).
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg || true
          fi

      - name: Build digest
        timeout-minutes: 75
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          # If set, episodes use Gemini two-host TTS; otherwise edge-tts.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          GEMINI_VOICES: ${{ vars.GEMINI_VOICES }}
          # For fetching listener questions (issues titled "Q: ...")
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          IDS="${{ github.event.inputs.ids || '' }}"
          EXTRA=""
          if [ -n "$IDS" ]; then EXTRA="--ids $IDS"; fi
          scirate-digest \
            --top "${{ github.event.inputs.top || '5' }}" \
            --range "${{ github.event.inputs.range || '1' }}" \
            $EXTRA

      - name: Commit digest and update podcast feed
        run: |
          set -e
          DATE=$(date -u +%F)
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "digests/$DATE"
          cp "output/$DATE/digest.md" "output/$DATE/podcast_script.txt" \
             "output/$DATE/papers.json" "digests/$DATE/"
          # Push with retries. On each attempt, rebase our staged files onto
          # the latest branch tip and REGENERATE the derived feed from the
          # current manifest — so a concurrent push never causes a merge
          # conflict on generated files (docs/feed.xml, episodes.json).
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --mixed "origin/$BRANCH"   # move to tip; keep working tree
            git add "digests/$DATE"
            python -m scirate_digest.feed --add "$DATE" \
              --mp3 "output/$DATE/digest.mp3" --papers "output/$DATE/papers.json"
            git add digests/episodes.json docs
            git commit -m "Digest for $DATE" || true
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push rejected (attempt $attempt); retrying"; sleep 3
          done
          echo "::error::could not push digest after retries"; exit 1

      - name: Publish podcast episode as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%F)
          # Recreate the release so its notes AND audio always reflect this
          # run (re-running a date fully replaces the prior release).
          gh release delete "digest-$DATE" --yes --cleanup-tag || true
          gh release create "digest-$DATE" \
            --title "SciRate Digest — $DATE" \
            --notes-file "output/$DATE/digest.md" \
            --target "${GITHUB_REF_NAME}" \
            "output/$DATE/digest.mp3#Podcast episode ($DATE)"

      - name: Close answered listener questions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%F)
          python -m scirate_digest.questions \
            --close-file "output/$DATE/questions.json" --date "$DATE" \
            || echo "::warning::could not close answered questions"

      - name: Upload artifacts (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: output/
          if-no-files-found: ignore
