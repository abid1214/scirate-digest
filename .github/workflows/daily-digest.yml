name: Daily SciRate Digest

on:
  schedule:
    # 13:30 UTC daily — after SciRate's morning listing settles.
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      top:
        description: "Number of papers"
        default: "10"
      range:
        description: "SciRate ranking window (days)"
        default: "1"
      ids:
        description: "Space-separated arXiv IDs (skips the SciRate scrape)"
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

defaults:
  run:
    # Use bash on every runner, including a self-hosted Windows one (Git for
    # Windows ships Git Bash, which GitHub Actions' `bash` shell finds).
    shell: bash

jobs:
  digest:
    # GitHub-hosted runner. SciRate's Cloudflare blocks datacenter IPs, so the
    # scrape is routed through a scraping-API service (SCRAPERAPI_KEY or
    # SCRAPINGBEE_KEY secret) that fetches from residential proxies.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build digest
        timeout-minutes: 40
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
        run: |
          IDS="${{ github.event.inputs.ids || '' }}"
          EXTRA=""
          if [ -n "$IDS" ]; then EXTRA="--ids $IDS"; fi
          scirate-digest \
            --top "${{ github.event.inputs.top || '10' }}" \
            --range "${{ github.event.inputs.range || '1' }}" \
            $EXTRA

      - name: Commit digest and update podcast feed
        run: |
          DATE=$(date -u +%F)
          mkdir -p "digests/$DATE"
          cp "output/$DATE/digest.md" "output/$DATE/podcast_script.txt" \
             "output/$DATE/papers.json" "digests/$DATE/"
          # Update the episode manifest and regenerate the RSS feed (docs/).
          python -m scirate_digest.feed --add "$DATE" \
            --mp3 "output/$DATE/digest.mp3" --papers "output/$DATE/papers.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "digests/$DATE" digests/episodes.json docs
          git diff --cached --quiet || git commit -m "Digest for $DATE"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish podcast episode as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%F)
          gh release create "digest-$DATE" \
            --title "SciRate Digest — $DATE" \
            --notes-file "output/$DATE/digest.md" \
            "output/$DATE/digest.mp3#Podcast episode ($DATE)" \
            || gh release upload "digest-$DATE" "output/$DATE/digest.mp3" --clobber

      - name: Upload artifacts (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: output/
          if-no-files-found: ignore
